spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:sams_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${TEST_DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DATABASE_USERNAME:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.seed.enabled=false
app.security.jwt.secret=test-only-student-attendance-jwt-secret-change-this-123456789
app.security.jwt.expiration-ms=3600000
