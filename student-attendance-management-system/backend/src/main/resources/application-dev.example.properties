# Copy this file to application-dev.properties or provide these values via environment variables.
# Do not commit real secrets.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/attendance_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Development-only seed users:
# admin@example.com / Admin@12345
# lecturer@example.com / Lecturer@12345
# student@example.com / Student@12345
app.seed.enabled=${APP_SEED_ENABLED:false}

# Generate your own random secret. No built-in signing key is provided.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.attendance.low-threshold=${ATTENDANCE_LOW_THRESHOLD:80}
