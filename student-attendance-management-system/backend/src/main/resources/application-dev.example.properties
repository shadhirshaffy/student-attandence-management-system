# Copy this file to application-dev.properties or provide these values via environment variables.
# Do not commit real secrets.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/attendence_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Development-only seed users:
# admin@example.com / Admin@12345
# lecturer@example.com / Lecturer@12345
# student@example.com / Student@12345
app.seed.enabled=${APP_SEED_ENABLED:true}

# Use a strong private value in real environments. This fallback is development-only.
app.security.jwt.secret=${JWT_SECRET:dev-only-student-attendance-jwt-secret-change-this-before-production-123456789}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
