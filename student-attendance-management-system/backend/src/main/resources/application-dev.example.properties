# Copy this file to application-dev.properties or provide these values via environment variables.
# Do not commit real secrets.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/student_attendance}
spring.datasource.username=${DATABASE_USERNAME:student_attendance_user}
spring.datasource.password=${DATABASE_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
