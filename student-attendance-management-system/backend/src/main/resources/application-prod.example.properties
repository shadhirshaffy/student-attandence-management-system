# Production profile reference.
# Prefer environment variables for real deployments.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

app.seed.enabled=false

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.frontend.base-url=${FRONTEND_BASE_URL}
app.attendance.low-threshold=${ATTENDANCE_LOW_THRESHOLD:80}
