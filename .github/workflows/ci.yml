name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        working-directory: student-attendance-management-system/backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: student-attendance-management-system/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: student-attendance-management-system/frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: student-attendance-management-system/frontend
        run: npm test

      - name: Install Playwright browsers
        working-directory: student-attendance-management-system/frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        working-directory: student-attendance-management-system/frontend
        run: npm run test:e2e

      - name: Build frontend
        working-directory: student-attendance-management-system/frontend
        run: npm run build
